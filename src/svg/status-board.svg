<svg viewBox="0 0 1600 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estado de la plataforma: hecho, provisorio y por definir" style="font-family: inherit;">
  <!-- Status board: one card per state, one per click. -->

  <g class="frag" data-fragment-index="1">
    <rect x="40" y="20" width="480" height="430" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 2.5;"/>
    <rect x="40" y="20" width="480" height="66" rx="16" style="fill: var(--fig-brand, #1b365d);"/>
    <rect x="40" y="60" width="480" height="26" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="68" y="64" style="font-size: 30px; font-weight: 700; fill: #ffffff;">Hecho</text>
    <circle cx="80" cy="132" r="15" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="80" y="139" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">✓</text>
    <text x="108" y="140" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Modelos versionados e inmutables</text>
    <circle cx="80" cy="188" r="15" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="80" y="195" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">✓</text>
    <text x="108" y="196" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Pipelines declarados y versionados</text>
    <circle cx="80" cy="244" r="15" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="80" y="251" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">✓</text>
    <text x="108" y="252" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Ejercicios reproducibles, con huella</text>
    <circle cx="80" cy="300" r="15" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="80" y="307" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">✓</text>
    <text x="108" y="308" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Análisis y publicaciones</text>
    <circle cx="80" cy="356" r="15" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="80" y="363" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">✓</text>
    <text x="108" y="364" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Decisiones por rol, encadenadas</text>
    <circle cx="80" cy="412" r="15" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="80" y="419" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">✓</text>
    <text x="108" y="420" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Sensibilidad de cada dato</text>
  </g>

  <g class="frag" data-fragment-index="2">
    <rect x="560" y="20" width="480" height="430" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-accent, #bf9c69); stroke-width: 2.5;"/>
    <rect x="560" y="20" width="480" height="66" rx="16" style="fill: var(--fig-accent, #bf9c69);"/>
    <rect x="560" y="60" width="480" height="26" style="fill: var(--fig-accent, #bf9c69);"/>
    <text x="588" y="64" style="font-size: 30px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Provisorio</text>
    <circle cx="600" cy="132" r="15" style="fill: var(--fig-accent, #bf9c69);"/>
    <text x="600" y="139" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: var(--fig-brand, #1b365d);">~</text>
    <text x="628" y="140" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Data Store en carpetas del disco N:</text>
    <circle cx="600" cy="188" r="15" style="fill: var(--fig-accent, #bf9c69);"/>
    <text x="600" y="195" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: var(--fig-brand, #1b365d);">~</text>
    <text x="628" y="196" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">La app lee los archivos de siempre</text>
    <circle cx="600" cy="244" r="15" style="fill: var(--fig-accent, #bf9c69);"/>
    <text x="600" y="251" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: var(--fig-brand, #1b365d);">~</text>
    <text x="628" y="252" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Procedencia en archivos aparte</text>
  </g>

  <g class="frag" data-fragment-index="3">
    <rect x="1080" y="20" width="480" height="430" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-muted, #52525b); stroke-width: 2.5; stroke-dasharray: 9 6;"/>
    <rect x="1080" y="20" width="480" height="66" rx="16" style="fill: var(--fig-muted, #52525b);"/>
    <rect x="1080" y="60" width="480" height="26" style="fill: var(--fig-muted, #52525b);"/>
    <text x="1108" y="64" style="font-size: 30px; font-weight: 700; fill: #ffffff;">Por definir</text>
    <circle cx="1120" cy="132" r="15" style="fill: var(--fig-muted, #52525b);"/>
    <text x="1120" y="139" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">?</text>
    <text x="1148" y="140" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Puente back end ↔ HD_plataform</text>
    <circle cx="1120" cy="188" r="15" style="fill: var(--fig-muted, #52525b);"/>
    <text x="1120" y="195" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">?</text>
    <text x="1148" y="196" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Data Store en servidor SQL o similar</text>
    <circle cx="1120" cy="244" r="15" style="fill: var(--fig-muted, #52525b);"/>
    <text x="1120" y="251" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">?</text>
    <text x="1148" y="252" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Autenticación de quien decide</text>
    <circle cx="1120" cy="300" r="15" style="fill: var(--fig-muted, #52525b);"/>
    <text x="1120" y="307" text-anchor="middle" style="font-size: 19px; font-weight: 700; fill: #ffffff;">?</text>
    <text x="1148" y="308" style="font-size: 23px; fill: var(--fig-ink, #1b365d);">Fase 4: publicación y embargos</text>
  </g>
</svg>
