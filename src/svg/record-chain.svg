<svg viewBox="0 0 1600 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La cadena de registros: de los datos, supuestos y modelo a la revisión y su gobernanza" style="font-family: inherit;">
  <defs>
    <marker id="rec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fig-muted, #52525b);"/>
    </marker>
  </defs>

  <!-- Inputs on the left (gold = data and assumptions, navy = model
       repository), records to the right; each card appears with its arrows. -->

  <g>
    <rect x="40" y="20" width="330" height="188" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-accent, #bf9c69); stroke-width: 2.5;"/>
    <rect x="40" y="20" width="330" height="62" rx="16" style="fill: var(--fig-accent, #bf9c69);"/>
    <rect x="40" y="58" width="330" height="24" style="fill: var(--fig-accent, #bf9c69);"/>
    <text x="64" y="62" style="font-size: 26px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Snapshot de datos</text>
    <g style="font-size: 22px; fill: var(--fig-ink, #1b365d);">
      <text x="64" y="120">salida de los pipelines,</text>
      <text x="64" y="152">fechada; no se reescribe</text>
    </g>
  </g>

  <g class="frag" data-fragment-index="1">
    <rect x="40" y="215" width="330" height="188" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-accent, #bf9c69); stroke-width: 2.5;"/>
    <rect x="40" y="215" width="330" height="62" rx="16" style="fill: var(--fig-accent, #bf9c69);"/>
    <rect x="40" y="253" width="330" height="24" style="fill: var(--fig-accent, #bf9c69);"/>
    <text x="64" y="257" style="font-size: 26px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Supuestos</text>
    <g style="font-size: 22px; fill: var(--fig-ink, #1b365d);">
      <text x="64" y="315">proyecciones externas,</text>
      <text x="64" y="347">juicio y ajustes, con</text>
      <text x="64" y="379">autor y justificación</text>
    </g>
  </g>

  <g class="frag" data-fragment-index="2">
    <rect x="440" y="118" width="330" height="188" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 2.5;"/>
    <rect x="440" y="118" width="330" height="62" rx="16" style="fill: var(--fig-brand, #1b365d);"/>
    <rect x="440" y="156" width="330" height="24" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="464" y="160" style="font-size: 26px; font-weight: 700; fill: #ffffff;">Set de información</text>
    <g style="font-size: 22px; fill: var(--fig-ink, #1b365d);">
      <text x="464" y="218">datos, supuestos y</text>
      <text x="464" y="250">tendencias, separados;</text>
      <text x="464" y="282">id = huella del contenido</text>
    </g>
    <line x1="372" y1="105" x2="436" y2="170" marker-end="url(#rec-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
    <line x1="372" y1="300" x2="436" y2="240" marker-end="url(#rec-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
  </g>

  <g class="frag" data-fragment-index="3">
    <rect x="40" y="410" width="330" height="188" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 2.5;"/>
    <rect x="40" y="410" width="330" height="62" rx="16" style="fill: var(--fig-brand, #1b365d);"/>
    <rect x="40" y="448" width="330" height="24" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="64" y="452" style="font-size: 26px; font-weight: 700; fill: #ffffff;">Versión del modelo</text>
    <g style="font-size: 22px; fill: var(--fig-ink, #1b365d);">
      <text x="64" y="510">bundle publicado,</text>
      <text x="64" y="542">identificada por</text>
      <text x="64" y="574">su huella</text>
    </g>
  </g>

  <g class="frag" data-fragment-index="4">
    <rect x="840" y="215" width="330" height="188" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 2.5;"/>
    <rect x="840" y="215" width="330" height="62" rx="16" style="fill: var(--fig-brand, #1b365d);"/>
    <rect x="840" y="253" width="330" height="24" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="864" y="257" style="font-size: 26px; font-weight: 700; fill: #ffffff;">Ejecución</text>
    <g style="font-size: 22px; fill: var(--fig-ink, #1b365d);">
      <text x="864" y="315">modelo + información</text>
      <text x="864" y="347">+ configuración;</text>
      <text x="864" y="379">si se repite, se reutiliza</text>
    </g>
    <line x1="772" y1="220" x2="836" y2="270" marker-end="url(#rec-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
    <line x1="372" y1="495" x2="836" y2="350" marker-end="url(#rec-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
  </g>

  <g class="frag" data-fragment-index="5">
    <rect x="1240" y="118" width="330" height="188" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 2.5;"/>
    <rect x="1240" y="118" width="330" height="62" rx="16" style="fill: var(--fig-brand, #1b365d);"/>
    <rect x="1240" y="156" width="330" height="24" style="fill: var(--fig-brand, #1b365d);"/>
    <text x="1264" y="160" style="font-size: 26px; font-weight: 700; fill: #ffffff;">Revisión del ejercicio</text>
    <g style="font-size: 22px; fill: var(--fig-ink, #1b365d);">
      <text x="1264" y="218">una corrida: todas sus</text>
      <text x="1264" y="250">ejecuciones, análisis</text>
      <text x="1264" y="282">y publicaciones</text>
    </g>
    <line x1="1172" y1="270" x2="1236" y2="220" marker-end="url(#rec-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
  </g>

  <g class="frag" data-fragment-index="6">
    <rect x="1240" y="410" width="330" height="188" rx="16" style="fill: var(--fig-bg, #fff); stroke: var(--fig-muted, #52525b); stroke-width: 2.5;"/>
    <rect x="1240" y="410" width="330" height="62" rx="16" style="fill: var(--fig-muted, #52525b);"/>
    <rect x="1240" y="448" width="330" height="24" style="fill: var(--fig-muted, #52525b);"/>
    <text x="1264" y="452" style="font-size: 26px; font-weight: 700; fill: #ffffff;">Gobernanza</text>
    <g style="font-size: 22px; fill: var(--fig-ink, #1b365d);">
      <text x="1264" y="510">archivos congelados y</text>
      <text x="1264" y="542">decisiones encadenadas</text>
      <text x="1264" y="574">por huella</text>
    </g>
    <line x1="1405" y1="310" x2="1405" y2="404" marker-end="url(#rec-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
    <text x="1421" y="364" style="font-size: 20px; font-style: italic; fill: var(--fig-ink, #1b365d);">se congela</text>
  </g>
</svg>
