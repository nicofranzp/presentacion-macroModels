<svg viewBox="0 0 1600 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De los proveedores de datos a un vintage publicado" style="font-family: inherit;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--fig-muted, #52525b);"/>
    </marker>
  </defs>

  <!-- 0: providers (visible from the start) -->
  <g>
    <rect x="10" y="20" width="280" height="280" rx="12" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 3;"/>
    <text x="150" y="66" text-anchor="middle" style="font-size: 28px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Proveedores</text>
    <g style="font-size: 20px; fill: var(--fig-ink, #1b365d);" text-anchor="middle">
      <text x="150" y="114">APIs BDE · CMF</text>
      <text x="150" y="150">planillas IPoM</text>
      <text x="150" y="186">comprados (EMBI, BBG)</text>
      <text x="150" y="222">historia legacy</text>
      <text x="150" y="258">vintages DAPM</text>
    </g>
  </g>

  <!-- 1: connectors -->
  <g class="frag" data-fragment-index="1">
    <line x1="292" y1="160" x2="331" y2="160" marker-end="url(#flow-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
    <rect x="337" y="20" width="280" height="280" rx="12" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 3;"/>
    <text x="477" y="66" text-anchor="middle" style="font-size: 28px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Conectores</text>
    <g style="font-size: 20px; fill: var(--fig-ink, #1b365d);" text-anchor="middle">
      <text x="477" y="114">uno por proveedor</text>
      <text x="477" y="150">solicitud → serie fuente</text>
      <text x="477" y="186">credenciales solo en</text>
      <text x="477" y="222">secrets.env</text>
    </g>
  </g>

  <!-- 2: definition -->
  <g class="frag" data-fragment-index="2">
    <line x1="619" y1="160" x2="658" y2="160" marker-end="url(#flow-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
    <rect x="664" y="20" width="280" height="280" rx="12" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 3;"/>
    <text x="804" y="66" text-anchor="middle" style="font-size: 28px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Definición</text>
    <g style="font-size: 20px; fill: var(--fig-ink, #1b365d);" text-anchor="middle">
      <text x="804" y="114">JSON validado (schema)</text>
      <text x="804" y="150">insumos → pasos en orden</text>
      <text x="804" y="186">resample · growth ·</text>
      <text x="804" y="222">splice · deflate · …</text>
      <text x="804" y="258">se registra su SHA-256</text>
    </g>
  </g>

  <!-- 3: snapshot -->
  <g class="frag" data-fragment-index="3">
    <line x1="946" y1="160" x2="985" y2="160" marker-end="url(#flow-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
    <rect x="991" y="20" width="280" height="280" rx="12" style="fill: var(--fig-bg, #fff); stroke: var(--fig-brand, #1b365d); stroke-width: 3;"/>
    <text x="1131" y="66" text-anchor="middle" style="font-size: 28px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Snapshot</text>
    <g style="font-size: 20px; fill: var(--fig-ink, #1b365d);" text-anchor="middle">
      <text x="1131" y="114">con fecha, en runtime/</text>
      <text x="1131" y="150">observados · proyecciones</text>
      <text x="1131" y="186">nowcast del</text>
      <text x="1131" y="222">trimestre en curso</text>
      <text x="1131" y="258">nunca se reescribe</text>
    </g>
  </g>

  <!-- 4: vintage -->
  <g class="frag" data-fragment-index="4">
    <line x1="1273" y1="160" x2="1312" y2="160" marker-end="url(#flow-arrow)" style="stroke: var(--fig-muted, #52525b); stroke-width: 3;"/>
    <rect x="1318" y="20" width="272" height="280" rx="12" style="fill: var(--fig-grid, #e4e4e7); stroke: var(--fig-accent, #bf9c69); stroke-width: 3;"/>
    <text x="1454" y="66" text-anchor="middle" style="font-size: 28px; font-weight: 700; fill: var(--fig-brand, #1b365d);">Vintage</text>
    <g style="font-size: 20px; fill: var(--fig-ink, #1b365d);" text-anchor="middle">
      <text x="1454" y="114">en el almacén de datos</text>
      <text x="1454" y="150">observado · proyección</text>
      <text x="1454" y="186">tendencias · nowcast</text>
      <text x="1454" y="222">metadatos por serie</text>
      <text x="1454" y="258">publish_vintage</text>
    </g>
  </g>
</svg>
